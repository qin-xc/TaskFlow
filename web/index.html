<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TaskFlow · 任务列表</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; color: #1b2a4a; background: #f4f6fb; }
    h1 { font-size: 24px; }
    table { border-collapse: collapse; background: #fff; min-width: 640px; }
    th, td { border: 1px solid #d8deeb; padding: 8px 14px; text-align: left; }
    th { background: #eef1f8; }
  </style>
</head>
<body>
  <h1>TaskFlow · 任务列表</h1>
  <p id="summary"></p>
  <table>
    <thead>
      <tr><th>标题</th><th>负责人</th><th>状态</th><th>截止日期</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
